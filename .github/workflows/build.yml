name: Build packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev nftables shellcheck unzip dnsmasq-base
      # Routers run the ucode their OpenWrt release ships, which can be a year
      # behind master: test with each of them, and with master to see what comes.
      - name: Build ucode of OpenWrt 24.10, 25.12 and master
        run: |
          git clone --depth 1 https://github.com/openwrt/libubox.git /tmp/libubox
          cmake -S /tmp/libubox -B /tmp/libubox/build -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF
          sudo cmake --build /tmp/libubox/build --target install -j4
          git clone --depth 1 https://github.com/openwrt/uci.git /tmp/uci
          cmake -S /tmp/uci -B /tmp/uci/build -DBUILD_LUA=OFF
          sudo cmake --build /tmp/uci/build --target install -j4
          sudo ldconfig
          for rel in 24.10 25.12 master; do
            sudo sh tests/build-ucode.sh "$rel" "/opt/ucode-$rel"
          done
          # Scripts under test call plain `ucode`: make it the oldest supported one.
          sudo ln -sf /opt/ucode-24.10/ucode /usr/local/bin/ucode
      - name: Get xray
        run: |
          v=$(sed -n 's/^MAYHEM_XRAY_VERSION="\(.*\)"/\1/p' mayhem/files/usr/share/mayhem/const.sh)
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/v$v/Xray-linux-64.zip"
          unzip -o /tmp/xray.zip xray -d /tmp/xray
      # The package build minifies JS with LuCI's jsmin; acorn compares the result.
      - name: Get LuCI and its jsmin
        run: |
          git clone --depth 1 --filter=blob:none --sparse -b openwrt-24.10 https://github.com/openwrt/luci.git /tmp/luci
          git -C /tmp/luci sparse-checkout set modules/luci-base/htdocs modules/luci-base/src themes/luci-theme-bootstrap/htdocs
          gcc -O2 -o /tmp/jsmin /tmp/luci/modules/luci-base/src/jsmin.c
          npm install --prefix /tmp/acorn acorn@8
      - name: Unit tests
        run: |
          for rel in 24.10 25.12 master; do
            echo "::group::ucode $rel"
            sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" UCODE="/opt/ucode-$rel/ucode" XRAY=/tmp/xray/xray \
              JSMIN=/tmp/jsmin NODE_PATH=/tmp/acorn/node_modules tests/run.sh || failed="$failed $rel"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "unit tests failed with ucode:$failed"; exit 1; }
      - name: End-to-end test in network namespaces
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" UCODE=ucode XRAY=/tmp/xray/xray tests/netns.sh
      - name: LuCI pages in a browser
        run: |
          pip install --break-system-packages playwright
          python3 -m playwright install --with-deps chromium
          UCODE=ucode sh tests/luci/run.sh /tmp/luci

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ["24.10.4", "25.12.2"]
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Fetch OpenWrt SDK
        run: |
          base="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/x86/64"
          sdk=$(curl -fsSL "$base/" | grep -o 'openwrt-sdk-[^"]*\.tar\.\(xz\|zst\)' | head -n1)
          curl -fsSL -o "/tmp/$sdk" "$base/$sdk"
          mkdir sdk
          case "$sdk" in
            *.zst) tar --zstd -xf "/tmp/$sdk" -C sdk --strip-components=1 ;;
            *) tar -xf "/tmp/$sdk" -C sdk --strip-components=1 ;;
          esac

      - name: Build
        working-directory: sdk
        run: |
          ./scripts/feeds update base luci
          ./scripts/feeds install luci-base
          cp -r ../mayhem ../luci-app-mayhem package/
          echo 'CONFIG_LUCI_LANG_ru=y' >> .config
          make defconfig
          make package/mayhem/compile package/luci-app-mayhem/compile -j"$(nproc)" V=s \
            MAYHEM_VERSION=${{ steps.ver.outputs.version }} MAYHEM_REPO=${{ github.repository }}
          mkdir -p ../dist
          find bin/packages -type f \( -name '*mayhem*.ipk' -o -name '*mayhem*.apk' \) -exec cp {} ../dist/ \;
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.release }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
