name: Build packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev nftables shellcheck unzip
      - name: Cache ucode binaries
        id: cache-ucode
        uses: actions/cache@v4
        with:
          path: |
            /opt/ucode-24.10
            /opt/ucode-25.12
            /opt/ucode-master
            /usr/local/lib/libubox.so*
            /usr/local/lib/libuci.so*
          key: ucode-build-${{ runner.os }}-${{ hashFiles('tests/build-ucode.sh') }}-v1
      - name: Build ucode of OpenWrt 24.10, 25.12 and master
        if: steps.cache-ucode.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/openwrt/libubox.git /tmp/libubox
          cmake -S /tmp/libubox -B /tmp/libubox/build -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF
          sudo cmake --build /tmp/libubox/build --target install -j4
          git clone --depth 1 https://github.com/openwrt/uci.git /tmp/uci
          cmake -S /tmp/uci -B /tmp/uci/build -DBUILD_LUA=OFF
          sudo cmake --build /tmp/uci/build --target install -j4
          sudo ldconfig
          for rel in 24.10 25.12 master; do
            sudo sh tests/build-ucode.sh "$rel" "/opt/ucode-$rel"
          done
      - name: Setup ucode symlink
        run: |
          sudo ldconfig
          sudo ln -sf /opt/ucode-24.10/ucode /usr/local/bin/ucode
      - name: Cache xray
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: /tmp/xray
          key: xray-${{ runner.os }}-${{ hashFiles('mayhem/files/usr/share/mayhem/const.sh') }}
      - name: Get xray
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          v=$(sed -n 's/^MAYHEM_XRAY_VERSION="\(.*\)"/\1/p' mayhem/files/usr/share/mayhem/const.sh)
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/v$v/Xray-linux-64.zip"
          unzip -o /tmp/xray.zip xray -d /tmp/xray
      - name: Cache LuCI and jsmin
        id: cache-luci
        uses: actions/cache@v4
        with:
          path: |
            /tmp/jsmin
            /tmp/acorn
          key: luci-jsmin-${{ runner.os }}-v1
      - name: Get LuCI and its jsmin
        if: steps.cache-luci.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse -b openwrt-24.10 https://github.com/openwrt/luci.git /tmp/luci
          git -C /tmp/luci sparse-checkout set modules/luci-base/src
          gcc -O2 -o /tmp/jsmin /tmp/luci/modules/luci-base/src/jsmin.c
          npm install --prefix /tmp/acorn acorn@8
      - name: Unit tests
        run: |
          for rel in 24.10 25.12 master; do
            echo "::group::ucode $rel"
            sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" UCODE="/opt/ucode-$rel/ucode" XRAY=/tmp/xray/xray \
              JSMIN=/tmp/jsmin NODE_PATH=/tmp/acorn/node_modules tests/run.sh || failed="$failed $rel"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "unit tests failed with ucode:$failed"; exit 1; }

  test-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev nftables unzip dnsmasq-base iproute2 wireguard-tools
      - name: Cache ucode binaries
        id: cache-ucode
        uses: actions/cache@v4
        with:
          path: |
            /opt/ucode-24.10
            /usr/local/lib/libubox.so*
            /usr/local/lib/libuci.so*
          key: ucode-build-${{ runner.os }}-${{ hashFiles('tests/build-ucode.sh') }}-v1
      - name: Build ucode of OpenWrt 24.10
        if: steps.cache-ucode.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/openwrt/libubox.git /tmp/libubox
          cmake -S /tmp/libubox -B /tmp/libubox/build -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF
          sudo cmake --build /tmp/libubox/build --target install -j4
          git clone --depth 1 https://github.com/openwrt/uci.git /tmp/uci
          cmake -S /tmp/uci -B /tmp/uci/build -DBUILD_LUA=OFF
          sudo cmake --build /tmp/uci/build --target install -j4
          sudo ldconfig
          sudo sh tests/build-ucode.sh 24.10 /opt/ucode-24.10
      - name: Setup ucode symlink
        run: |
          sudo ldconfig
          sudo ln -sf /opt/ucode-24.10/ucode /usr/local/bin/ucode
      - name: Cache xray
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: /tmp/xray
          key: xray-${{ runner.os }}-${{ hashFiles('mayhem/files/usr/share/mayhem/const.sh') }}
      - name: Get xray
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          v=$(sed -n 's/^MAYHEM_XRAY_VERSION="\(.*\)"/\1/p' mayhem/files/usr/share/mayhem/const.sh)
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/v$v/Xray-linux-64.zip"
          unzip -o /tmp/xray.zip xray -d /tmp/xray
      - name: End-to-end test in network namespaces
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" UCODE=ucode XRAY=/tmp/xray/xray tests/netns.sh

  test-luci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev unzip
      - name: Cache ucode binaries
        id: cache-ucode
        uses: actions/cache@v4
        with:
          path: |
            /opt/ucode-24.10
            /usr/local/lib/libubox.so*
            /usr/local/lib/libuci.so*
          key: ucode-build-${{ runner.os }}-${{ hashFiles('tests/build-ucode.sh') }}-v1
      - name: Build ucode of OpenWrt 24.10
        if: steps.cache-ucode.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/openwrt/libubox.git /tmp/libubox
          cmake -S /tmp/libubox -B /tmp/libubox/build -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF
          sudo cmake --build /tmp/libubox/build --target install -j4
          git clone --depth 1 https://github.com/openwrt/uci.git /tmp/uci
          cmake -S /tmp/uci -B /tmp/uci/build -DBUILD_LUA=OFF
          sudo cmake --build /tmp/uci/build --target install -j4
          sudo ldconfig
          sudo sh tests/build-ucode.sh 24.10 /opt/ucode-24.10
      - name: Setup ucode symlink
        run: |
          sudo ldconfig
          sudo ln -sf /opt/ucode-24.10/ucode /usr/local/bin/ucode
      - name: Cache LuCI source
        id: cache-luci-src
        uses: actions/cache@v4
        with:
          path: /tmp/luci
          key: luci-src-${{ runner.os }}-openwrt-24.10
      - name: Get LuCI
        if: steps.cache-luci-src.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --filter=blob:none --sparse -b openwrt-24.10 https://github.com/openwrt/luci.git /tmp/luci
          git -C /tmp/luci sparse-checkout set modules/luci-base/htdocs modules/luci-base/src themes/luci-theme-bootstrap/htdocs
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
      - name: LuCI pages in a browser
        run: |
          pip install --break-system-packages playwright
          python3 -m playwright install --with-deps chromium
          UCODE=ucode sh tests/luci/run.sh /tmp/luci

  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ["24.10.4", "25.12.2"]
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            # OpenWrt 25.12+ uses apk-tools which requires strict package version syntax:
            # no hyphens in version, pre-release suffixes must use underscore (_alpha, _beta, _pre, _rc).
            v="$(printf '%s\n' "$v" | sed -E 's/-exp\.?([0-9]+)/_pre\1/; s/-rc\.?([0-9]+)/_rc\1/; s/-beta\.?([0-9]+)/_beta\1/; s/-alpha\.?([0-9]+)/_alpha\1/; s/-/./g')"
          else
            v="0.0.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The official SDK container comes from ghcr.io, next to the runners.
      - name: OpenWrt SDK from its container
        id: box
        run: |
          img="ghcr.io/openwrt/sdk:x86_64-${{ matrix.release }}"
          if timeout 900 docker pull -q "$img" && cid="$(docker create "$img")"; then
            mkdir sdk
            if docker cp "$cid:/builder/." sdk/ && [ -x sdk/scripts/feeds ]; then
              echo "from=container" >> "$GITHUB_OUTPUT"
              docker rm "$cid" >/dev/null
              exit 0
            fi
            docker rm "$cid" >/dev/null
            rm -rf sdk
          fi
          echo "::error::cannot get OpenWrt SDK from $img"
          exit 1

      - name: Cache SDK prep
        id: cache-sdk-prep
        uses: actions/cache@v4
        with:
          path: |
            sdk/feeds
            sdk/dl
            sdk/staging_dir/host*
            sdk/.config
          key: openwrt-sdk-prep-${{ matrix.release }}-${{ hashFiles('**/Makefile') }}

      - name: Prepare feeds
        if: steps.cache-sdk-prep.outputs.cache-hit != 'true'
        working-directory: sdk
        run: |
          sed -e 's,https://git.openwrt.org/feed/,https://github.com/openwrt/,' \
            -e 's,https://git.openwrt.org/openwrt/,https://github.com/openwrt/,' \
            -e 's,https://git.openwrt.org/project/,https://github.com/openwrt/,' \
            feeds.conf.default > feeds.conf
          ./scripts/feeds update base luci
          ./scripts/feeds install luci-base
          echo 'CONFIG_LUCI_LANG_ru=y' >> .config
          make defconfig

      - name: Build
        working-directory: sdk
        run: |
          cp -r ../mayhem ../luci-app-mayhem package/
          make package/mayhem/compile package/luci-app-mayhem/compile -j"$(nproc)" V=s \
            MAYHEM_VERSION=${{ steps.ver.outputs.version }} MAYHEM_REPO=${{ github.repository }}
          mkdir -p ../dist
          find bin/packages -type f \( -name '*mayhem*.ipk' -o -name '*mayhem*.apk' \) -exec cp {} ../dist/ \;
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.release }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-unit, test-e2e, test-luci, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*
